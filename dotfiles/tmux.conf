# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'NAndLib/catppuccine-tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'woodstok/tmux-butler'

# catppuccin configuration
set -g @catppuccin_flavor 'onedark'

set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_2},fg=#{@thm_surface_0}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_overlay_2}]█"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_green}]#[bg=#{@thm_green},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_green}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

set -g @catppuccin_window_text " #W"
# lock glyph while the F12 "off" key table (prefix-lock) is active
set -g @catppuccin_window_current_text " #{?#{==:#{client_key_table},off},󰌾 ,}#W"
set -g @catppuccin_window_current_number_color "#{@thm_green}"

set -g @catppuccin_window_flags "icon"

set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰧞"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_background "none"

set -g @catppuccin_directory_text " #{s|$HOME|~|:pane_current_path}"
set -g @catppuccin_pane_active_border_style "#{?pane_in_mode,fg=yellow,#{?pane_synchronized,fg=magenta,fg=green}}"

# for vim
set -g @resurrect-strategy-vim 'session'

# clipbard configuration
set -s set-clipboard on
# Enable extended keys
set -s extended-keys on
# Extended key encoding (CSI u format for Neovim/Emacs compat)
set -s extended-keys-format 'csi-u'

# Enable RGB colour if running in xterm(1)
set -g default-terminal 'tmux-256color'
set -as terminal-features 'xterm-256color:extkeys'
set -ag terminal-overrides ",xterm-256color:RGB:clipboard:Ms=\\E]52;c%p1%.0s;%p2%s\\7"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  run -b '~/.tmux/plugins/tpm/tpm' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  run -b '~/.tmux/plugins/tpm/tpm' \;\
  refresh-client -S

# split panes using | and -
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}' -l 20
bind v split-window -h
bind V split-window -h -c '#{pane_current_path}'
bind s split-window -v
bind S split-window -v -c '#{pane_current_path}'
bind c new-window
bind C new-window -c '#{pane_current_path}'
unbind '"'
unbind %

# reload config file
bind R source-file ~/.tmux.conf \; display-message "Configuration file reloaded"

# switch panes using Ctrl-arrow without prefix
bind h previous-window
bind l next-window
bind "'" last-window

# Copy mode
unbind p
unbind-key -T copy-mode-vi v
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# Blockwise copy mode:
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe

# Display pop-up window for scratch usage
bind W if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    popup -h 75% -w 75% -E 'tmux attach -t scratch || tmux new -s scratch'
}

# More word separators
set -g word-separators " -_@.:/;"

set -g escape-time 10
set -g initial-repeat-time 800
set -g repeat-time 400

set -g mouse on
set-window-option -g mode-keys vi

set -g monitor-activity on
set -g visual-activity both
set -g activity-action other
set -g status-interval 1

set -g set-titles on
set -g set-titles-string '#I:#{window_panes}:#W'

set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style 'width=1,bg=default,fg=green'

set-option -g history-limit 10000

set -g focus-events on
set -g status-position bottom

set -g default-command "/usr/bin/fish"
set-option -g renumber-windows on

# Allow new sessions and panes to know about the CONDA_DEFAULT_ENV environment
set -ga update-environment 'CONDA_DEFAULT_ENV'

# Initialize TMUX plugin manager (keep this near the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# catppuccin status-line modules (must be set after the plugin has loaded)
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_application}#{E:@catppuccin_status_host}#{E:@catppuccin_status_session}"

# Fix window-activity styles to conform with theme
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"

# kitty.conf — only settings that differ from kitty's defaults.
# Full reference: `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`

# Fonts
font_family Iosevka Term
font_size 8

# Cursor
cursor none
cursor_text_color #aab2bf

# Scrollback
scrollback_lines 10000

# Mouse
url_color #61afef
paste_actions quote-urls-at-prompt
strip_trailing_spaces always
select_by_word_characters @-./_~?&=%+#;
default_pointer_shape arrow
pointer_shape_when_dragging beam
mouse_map shift+left press ungrabbed,grabbed mouse_selection normal

# Bell
enable_audio_bell no
window_alert_on_bell no

# Window layout
confirm_os_window_close 0

# Tab bar
tab_bar_align start

# Color scheme (One Dark)
foreground #aab2bf
background #282C34
selection_foreground #282C34
selection_background #aab2bf
dim_opacity 0.75

color0  #5c6370
color8  #5c6370
color1  #e06c75
color9  #e06c75
color2  #98c379
color10 #98c379
color3  #e5c07b
color11 #e5c07b
color4  #61afef
color12 #61afef
color5  #c678dd
color13 #c678dd
color6  #56b6c2
color14 #56b6c2
color7  #abb2bf
color15 #abb2bf

mark1_background white
mark2_background white
mark3_background magenta

# Advanced
shell fish
editor nvim
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append
clipboard_max_size 64
shell_integration enabled no-cursor
term xterm-256color

# Keyboard shortcuts
# shift+enter sends CSI-u so TUIs can tell it apart from enter
map shift+enter send_text all \x1b[13;2u

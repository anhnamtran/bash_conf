# Polybar's internal/pulseaudio module never reconnects to a restarted server:
# the bar stops updating, and clicking the volume icon aborts polybar.
# Relaunch polybar whenever pipewire-pulse (re)starts, but only if it's already
# running (skips login, where pulse can be socket-activated before X is up).
# systemd-run puts polybar in its own unit, outside this service's sandbox and
# cgroup (KillMode=control-group would otherwise kill it on the next stop).
# Type=forking: launcher.sh backgrounds polybar and exits; the unit then lives
# until the last polybar exits instead of being torn down with the launcher.
[Service]
ExecStartPost=-/bin/sh -c 'pgrep -x polybar >/dev/null && exec systemd-run --user --collect --quiet --description="Polybar (relaunched after pipewire-pulse start)" -p Type=forking -p GuessMainPID=no %h/.config/polybar/launcher.sh'
